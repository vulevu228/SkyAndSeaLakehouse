[project]
name = "skysea"
version = "0.1.0"
description = "Sky & Sea Lakehouse: OpenSky flights + AIS ships on a PySpark / Delta Lake medallion pipeline"
requires-python = ">=3.10"
# pyspark and delta-spark must be a matching pair: delta-spark 4.4.x supports pyspark 4.0.1-4.2.0.
dependencies = [
    "pyspark==4.2.0",
    "delta-spark==4.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
